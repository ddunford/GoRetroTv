name: CI

# Every push and every pull request. The boot gate and the oracle comparison are the checks that
# will eventually say whether the emulator is right; this workflow only says whether the tree is
# buildable, formatted, vetted and race-free, which is the floor everything else stands on.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: repository secret history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the complete Git history with Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact .

  conformance:
    name: architecture conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run architecture conformance
        run: ./ctl.sh conformance --classification STATIC

  firmware-image:
    name: firmware absent from runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and inspect the runtime image
        run: ./ctl.sh conformance --classification IMAGE

  check:
    name: vet, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          # Nothing to cache. The module has no external dependencies (ADR 0001), so there is no
          # go.sum, `go mod download` has nothing to fetch, and pointing setup-go at a lockfile
          # that does not exist only produces a warning nobody reads.
          cache: false

      - name: Report the toolchain
        run: |
          go version
          go env GOTOOLCHAIN GOFLAGS

      - name: gofmt
        run: |
          set -euo pipefail
          # Captured to a variable rather than piped into a test: reading an exit status through a
          # pipe reads the pipe's last command, and gofmt -l exits 0 whether or not it found
          # anything. The output is the signal here, not the status.
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd; run make fmt"
            printf '%s\n' "$unformatted"
            exit 1
          fi
          echo "all Go files are formatted"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # staticcheck runs inside this: .golangci.yml is v2 format and enables it there, so a
        # separate staticcheck step would be a second copy of the same configuration to keep in
        # step with this one. The action major and the linter version are pinned together because
        # v8 was the first that supports golangci-lint v2 (>= v2.1.0), and the linter version is
        # pinned to the one developers run locally - a gate that finds different things in CI than
        # on the machine that wrote the code is a gate people learn to ignore. v2.13.2 supports Go
        # 1.27; v2.1.6 was built with Go 1.25 and cannot analyze this module. v9 is v8 plus the
        # node24 runtime, which the runners now require; it keeps v8's `>= v2.1.0` constraint.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: go test -race
        # The race detector is the arbiter. Nothing in the instruction loop is concurrent by
        # design, which is exactly why a race appearing there needs to be loud.
        #
        # No firmware here: the flash images are Pace's and are not redistributable (see
        # firmware/MANIFEST.md), so anything that needs them must skip when they are absent rather
        # than fail. A test that cannot run without them is a test that cannot run in CI.
        run: go test -race ./...

      - name: build
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o /tmp/ci-bin/ ./cmd/...
          ls -l /tmp/ci-bin/

  vulnerabilities:
    name: vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install govulncheck
        # Pin the scanner so a new release cannot change the CI verdict without a reviewed edit.
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" -version

      - name: No called vulnerabilities
        # The baseline is empty on Go 1.27.1. The wrapper rejects any new called finding and
        # guards against a malformed or empty scan report.
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./tools/vulncheck.sh
