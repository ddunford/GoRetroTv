[harness]
catalogue = "plan/architecture-rules.md"
rule_id = "ARCH-[A-Z]+-\\d+"
probes = "conformance/probes"
task_source = "beads"
# A closed task can still own a recorded decision. The gate checks that the task exists.
task_liveness = "exists"
mirror = "scripts/conformance/mirror-rules-index.py"
covered_classifications = ["STATIC"]

[[rule]]
id = "ARCH-DEV-1"
invariant = "Developer surfaces bind only to loopback"
source = "plan/module-decisions.md § Deployment and access"
classification = "STATIC"
arming = "ARMED"
state = "enforced"
command = ["conformance/checkers/developer_bind.py"]
tooling = "Runs the real Go config loader for loopback, public and container scenarios, and asks Docker Compose for its effective port mapping using the committed example env."
subjects = ["internal/config/config.go", "docker-compose.yml", ".env.example", "conformance/checkers/bindcheck/main.go"]
coverage_detector = "bind-subject-missing"
probes = [
  { name = "guard-removed", detectors = ["non-loopback-accepted"] },
  { name = "override-elsewhere", detectors = ["bind-override-elsewhere"] },
  { name = "override-interpolated", detectors = ["container-override-not-literal"] },
  { name = "public-port", detectors = ["container-port-public"] },
  { name = "config-removed", detectors = ["bind-subject-missing"] },
]
halves = [
  { half = "the binding loader and compose subjects exist", held_by = "probe", probe = "config-removed", detectors = ["bind-subject-missing"] },
  { half = "a public bind without explicit container override is refused", held_by = "probe", probe = "guard-removed", detectors = ["non-loopback-accepted"] },
  { half = "only the compose service sets the override", held_by = "probe", probe = "override-elsewhere", detectors = ["bind-override-elsewhere"] },
  { half = "compose sets the override as a literal", held_by = "probe", probe = "override-interpolated", detectors = ["container-override-not-literal"] },
  { half = "the container is published on host loopback", held_by = "probe", probe = "public-port", detectors = ["container-port-public"] },
]

[[rule]]
id = "ARCH-SNAP-1"
invariant = "Every device state field is captured by Snapshot and Restore"
source = "plan/module-decisions.md § The core patterns"
classification = "STATIC"
arming = "SELF-ARMING"
state = "pending"
owner_task = "gort-87m.3"
reason = "The Device contract exists; the checker and its negative control have not been added."

[[rule]]
id = "ARCH-DET-1"
invariant = "CPU and devices use instruction time, with no wall clock or goroutine in the instruction loop"
source = "plan/module-decisions.md § The core patterns"
classification = "STATIC"
arming = "SELF-ARMING"
state = "pending"
owner_task = "gort-87m.4"
reason = "The source boundary can be checked now, but its detector and probes have not been added."

[[rule]]
id = "ARCH-LAYER-1"
invariant = "Core and device packages do not import outward transport packages"
source = "plan/module-decisions.md § Application structure"
classification = "STATIC"
arming = "SELF-ARMING"
state = "pending"
owner_task = "gort-87m.5"
reason = "The import boundary can be checked now, but its detector and probe have not been added."

[[rule]]
id = "ARCH-FW-1"
invariant = "Firmware bytes are absent from git and built images"
source = "plan/module-decisions.md § Deployment and access"
classification = "STATIC"
arming = "ARMED"
state = "pending"
owner_task = "gort-87m.6"
reason = "Git and image checks can be written now, but their detectors and probes have not been added."

[[rule]]
id = "ARCH-PLATFORM-1"
invariant = "The shared platform layer does not import domain packages"
source = "plan/module-decisions.md § The shared / platform layer"
classification = "STATIC"
arming = "ARMED"
state = "enforced"
command = ["conformance/checkers/platform_imports.py"]
tooling = "go list -e enumerates parsed imports, including imports of not-yet-built packages; the Go toolchain is already required, so no architecture dependency is added."
subjects = ["internal/platform"]
coverage_detector = "platform-subject-missing"
probes = [
  { name = "domain-import", detectors = ["platform-imports-domain"] },
  { name = "platform-removed", detectors = ["platform-subject-missing"] },
]
halves = [
  { half = "the platform layer contains tracked Go source", held_by = "probe", probe = "platform-removed", detectors = ["platform-subject-missing"] },
  { half = "platform packages do not import domain packages", held_by = "probe", probe = "domain-import", detectors = ["platform-imports-domain"] },
]

[[rule]]
id = "ARCH-MODULE-1"
invariant = "The Go module graph contains only the project module until a dependency is deliberately approved"
source = "docs/decisions/0001-scaffold.md § Dependencies"
classification = "STATIC"
arming = "ARMED"
state = "enforced"
command = ["conformance/checkers/module_graph.py"]
tooling = "go mod edit -json parses the module declaration without fetching packages; any nonempty require set changes the single-module graph and fails deterministically."
subjects = ["go.mod"]
coverage_detector = "module-file-missing"
probes = [
  { name = "dependency-added", detectors = ["external-module"] },
  { name = "module-file-removed", detectors = ["module-file-missing"] },
]
halves = [
  { half = "the module declaration exists", held_by = "probe", probe = "module-file-removed", detectors = ["module-file-missing"] },
  { half = "the module declares no external requirements", held_by = "probe", probe = "dependency-added", detectors = ["external-module"] },
]
