services:
  goretrotv:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    environment:
      # `:?` rather than `:-`: GORETROTV_ENV is required, and a compose-layer default would put
      # the guess back one level below the loader that refuses it.
      GORETROTV_ENV: ${GORETROTV_ENV:?set it in .env - see .env.example}
      # The mount below, named explicitly. Until now the binary found its firmware through a
      # relative path that resolved only because the distroless base sets no WORKDIR; anything
      # that set one would have turned this into a wrong-or-absent ROM, which is the very failure
      # the manifest verification exists to catch.
      GORETROTV_FIRMWARE_DIR: /firmware
      GORETROTV_LOG_LEVEL: ${GORETROTV_LOG_LEVEL:-debug}
      GORETROTV_LOG_FORMAT: ${GORETROTV_LOG_FORMAT:-json}
      # Inside the container the listener must accept the published mapping, so it binds all
      # interfaces here. The exposure decision lives in the port mapping below, which is
      # loopback-only: the recorded rule is that developer surfaces are not reachable off-host
      # (CLAUDE.md -> Deployment and access).
      GORETROTV_HTTP_ADDR: ":8099"
      GORETROTV_ENABLE_PPROF: ${GORETROTV_ENABLE_PPROF:-false}
    ports:
      - "127.0.0.1:${GORETROTV_PORT:-8099}:8099"
    volumes:
      # THE FIRMWARE IS NOT REDISTRIBUTABLE and is never baked into the image. It is mounted
      # read-only from the working copy; a clone without it is inert by design.
      - ./firmware:/firmware:ro
    restart: unless-stopped
